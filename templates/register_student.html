{% extends "base.html" %}
{% block content %}
<h2>Student Registration</h2>
<div align="center">
<form method="POST">
    <input class="login" name="name" placeholder="Full Name">
    <input class="login" name="email" placeholder="Email">
    <input class="login" type="password" name="password" placeholder="Password">
    <input class="login" name="contact" placeholder="Contact Number">
    <button class="submit login" >Register</button>
</form>
</div>
{% endblock %}
