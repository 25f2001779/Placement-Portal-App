{% extends "base.html" %}
{% block content %}
<h2>My Applications</h2>
<table class="table-border">
    <tr>
        <th>Company</th>
        <th>Job</th>
        <th>Status</th>
    </tr>
    {% for a in apps %}
    <tr>
        <td>{{ a.company }}</td>
        <td>{{ a.job_title }}</td>
        <td>{{ a.status }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
