{% extends "base.html" %}
{% block content %}
<h2>Applications</h2>
<table class="table-border">
    <tr>
        <th>Student</th>
        <th>Application Date</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    {% for a in apps %}
    <tr>
        <td>{{ a.name }}</td>
        <td>{{ a.application_date }}</td>
        <td>{{ a.status }}</td>
        <td>
            <a href="/company/update_status/{{ a.id }}/Shortlisted">Shortlist</a> |
            <a href="/company/update_status/{{ a.id }}/Selected">Select</a> |
            <a href="/company/update_status/{{ a.id }}/Rejected">Reject</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
